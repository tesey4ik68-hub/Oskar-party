<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oscar Night 2025 - Corporate Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                100: '#F9F1D8',
                200: '#F0DEAA',
                300: '#E6CB7D',
                400: '#DDB850',
                500: '#D4A523', // Primary Gold
                600: '#AA841C',
                700: '#806315',
                800: '#55420E',
                900: '#2B2107',
              },
              'oscar-red': '#8A1515',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
              sans: ['"Lato"', 'sans-serif'],
            },
            backgroundImage: {
              'sparkle-pattern': "url('https://www.transparenttextures.com/patterns/stardust.png')",
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2.5s infinite linear',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #F9F1D8;
      }
      .gold-text-shadow {
        text-shadow: 0px 2px 4px rgba(212, 165, 35, 0.4);
      }
      .red-carpet-gradient {
        background: linear-gradient(180deg, #8A1515 0%, #520606 100%);
      }
    </style>

  }
}
</script>
